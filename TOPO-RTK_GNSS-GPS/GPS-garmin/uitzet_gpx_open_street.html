<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>GPX viewer – positie & tijd</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  body { margin:0; font-family: sans-serif; }
  #map { width:100%; height:100vh; }

  .controls {
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:8px 10px;
    border-radius:4px;
    box-shadow:0 0 6px rgba(0,0,0,0.3);
  }

  .info {
    position:absolute;
    bottom:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:6px 10px;
    border-radius:4px;
    box-shadow:0 0 6px rgba(0,0,0,0.3);
    font-size:13px;
  }
</style>
</head>

<body>

<div class="controls">
  <input type="file" id="gpxInput" accept=".gpx">
</div>

<div class="info" id="info">
  Beweeg over het GPX-spoor
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-gpx@1.7.0/gpx.min.js"></script>

<script>
  // Kaart
  const map = L.map('map').setView([51.2, 4.4], 12);

  // OSM basemap
  const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '© OpenStreetMap contributors' }
  ).addTo(map);

  let gpxLayer = null;
  const infoBox = document.getElementById("info");

  // GPX inladen
  document.getElementById("gpxInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {

      if (gpxLayer) {
        map.removeLayer(gpxLayer);
      }

      gpxLayer = new L.GPX(evt.target.result, {
        async: true,
        marker_options: {
          startIconUrl: null,
          endIconUrl: null,
          shadowUrl: null
        },
        polyline_options: {
          color: "red",
          weight: 3
        }
      });

      gpxLayer.on("loaded", function(e) {
        map.fitBounds(e.target.getBounds());
      });

      gpxLayer.on("mousemove", function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lon = e.latlng.lng.toFixed(6);

        let timeText = "tijd: n.v.t.";

        if (e.target && e.target._info && e.target._info.time) {
          const t = new Date(e.target._info.time);
          timeText = t.toISOString().replace("T"," ").replace("Z","");
        }

        infoBox.innerHTML =
          `<b>Positie</b><br>
           lat: ${lat}<br>
           lon: ${lon}<br>
           <b>Tijd</b><br>${timeText}`;
      });

      gpxLayer.addTo(map);
    };

    reader.readAsText(file);
  });
</script>

</body>
</html>
